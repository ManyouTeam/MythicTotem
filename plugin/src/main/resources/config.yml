# MythicTotem by @PQguanfang
#
# READ THE WIKI: mythictotem.superiormc.cn

debug: false

config-files:
  language: en_US
  # Premium version only.
  per-player-language: true
  force-parse-mini-message: true

debuild-item-method: 'LEGACY'

# Support value: DEFAULT or ITEMBRIDGE
hook-item-method: 'DEFAULT'

# Item Price
item-price:
  shulker-box-check: false
  # Support Value: Bukkit, ItemFormat.
  check-method: Bukkit
  item-format:
    require-same-key: false
    ignore-key:
      - 'lore'
      - 'damage'
      - 'tool.damage-per-block'

cooldown-tick: 5

# Default location for entity_spawn and mythicmobs_spawn actions.
# Supported values: TOTEM_CENTER, TOTEM_START, TRIGGER_BLOCK, PLAYER.
spawn-location: TOTEM_CENTER

trigger:
  BlockPlaceEvent:
    enabled: true
    require-shift: false
    black-creative-mode: false
  PlayerInteractEvent:
    enabled: true
    require-shift: true
    black-creative-mode: false
  PlayerDropItemEvent:
    enabled: false
    require-shift: false
    black-creative-mode: false
  # Will check end crystal only.
  EntityPlaceEvent:
    enabled: true
    require-shift: false
    black-creative-mode: false
  # This event does not support get the player object, so cooldown-tick option does not affect this trigger.
  # And all actions and conditions that related to player can not be used.
  # And all placeholders that related to player also can not be used.
  # Otherwise, you will get tons of errors on console!!!
  BlockRedstoneEvent:
    enabled: false
  # This event does not support get the player object, so cooldown-tick option does not affect this trigger.
  # And all actions and conditions that related to player can not be used.
  # And all placeholders that related to player also can not be used.
  # Otherwise, you will get tons of errors on console!!!
  # Premium version only.
  BlockPistonEvent:
    enabled: false

math:
  enabled: false
  enable-function: true
  scale: 2

number-display:
  format:
    enabled: true
    decimal: "#,##0.00##########"
    integer: "#,##0"
  strip-trailing-zeros:
    enabled: true

bonus-effects:
  enabled: false
  check-radius: 10
  range-display:
    enabled: true
    particle: END_ROD
  limit:
    enabled: true
    value:
      default:
        default: 1
        vip: 2
      # Group ID
      # advanced:
      #   default: 1
      #   vip: 1
    conditions:
      vip:
        1:
          type: permission
          permission: 'group.vip'
    same-totem-only-active-once: true
  gui:
    enabled: true
    title: '{lang:bonus-gui.title}'
    size: 27
    anti-dupe-fixes: false
    ignore-click-outside: false
    totem-info-item:
      slot: 11
      material: BEACON
      name: '{lang:bonus-gui.totem-info-item.name}'
      lore:
        - '{lang:bonus-gui.totem-info-item.id}'
        - '{lang:bonus-gui.totem-info-item.range}'
        - '{lang:bonus-gui.totem-info-item.level}'
        - '{lang:bonus-gui.totem-info-item.bonus}'
        - '{lang:bonus-gui.totem-info-item.description}'
        - '{lang:bonus-gui.totem-info-item.you}'
        - '{lang:bonus-gui.totem-info-item.limit}'
        - '{lang:bonus-gui.totem-info-item.active-amount}'
    totem-upgrade-item:
      slot: 15
      material: EMERALD_BLOCK
      name: '{lang:bonus-gui.totem-upgrade-item.name}'
      lore:
        - '{lang:bonus-gui.totem-upgrade-item.premium-only}'
        - '{lang:bonus-gui.totem-upgrade-item.bonus}'
        - '{lang:bonus-gui.totem-upgrade-item.description}'
        - '{lang:bonus-gui.totem-upgrade-item.level}'
        - '{lang:bonus-gui.totem-upgrade-item.price}'
    totem-max-upgrade-item:
      material: BARRIER
      name: '{lang:bonus-gui.totem-max-upgrade-item.name}'
      lore:
        - '{lang:bonus-gui.totem-max-upgrade-item.bonus}'
        - '{lang:bonus-gui.totem-max-upgrade-item.description}'

libreforge-hook: false
libreforge-effects:
  - id: example
    effects:
      - id: bonus_health
        args:
          health: 40
      - id: damage_multiplier
        args:
          multiplier: 4.0
        triggers:
          - melee_attack
    conditions: []
